# compose-launcher config for WarAndPeaceEntropy (https://github.com/Nate314/WarAndPeaceEntropy)
# The launcher requires at least one port line, but this script serves nothing.
# UNUSED_PORT only satisfies that rule: docker-compose.yml does not read it and publishes no ports.
port UNUSED_PORT 8080

url No web page: the container computes the entropy of WarAndPeace.txt once and exits.
url Output: .\run.ps1 logs entropy   or   ./run.sh logs entropy
